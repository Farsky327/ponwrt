name: Release PonWrt

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      prerelease:
        description: Mark as prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: release
    strategy:
      fail-fast: false
      matrix:
        target:
          - an7581
          - an7583

    steps:
      - uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf zip \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-${{ matrix.target }}-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-${{ matrix.target }}-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load repository signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
          fi

      - name: Configure ${{ matrix.target }}
        run: |
          ./scripts/kconfig.pl + \
            "configs/${{ matrix.target }}.config" \
            configs/release.config > .config
          make defconfig

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build ${{ matrix.target }}
        run: make -j"$(nproc)"

      - name: Pack ${{ matrix.target }}
        run: |
          mkdir -p release tmp_pkg
          BUILD_TIME=$(TZ=Asia/Shanghai date +%Y%m%d%H%M)
          SRC="bin/targets/airoha/${{ matrix.target }}"
          # 同一型号（profile）的所有镜像合并为一个 zip：
          #   ponwrt-airoha-an7581-fiberhome_hg5585f-cu-usb-sfp-initramfs-recovery.itb
          #   ponwrt-airoha-an7581-fiberhome_hg5585f-cu-usb-sfp-squashfs-sysupgrade.itb
          # → ponwrt-airoha-an7581-fiberhome_hg5585f-cu-usb-sfp-<BUILD_TIME>.zip
          for f in "$SRC"/*.bin "$SRC"/*.itb "$SRC"/*.fip; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            stem="${base%.*}"
            ext="${base##*.}"
            # 剥离镜像类型后缀得到型号；型号自身可含连字符，故按白名单剥而不是切段
            model="$stem"
            for t in squashfs-sysupgrade-gpt ext4-sysupgrade ext4-factory \
                     initramfs-recovery initramfs-kernel \
                     squashfs-sysupgrade squashfs-factory \
                     combined-efi combined initramfs sdcard \
                     bl31-uboot preloader fip; do
              model="${model%-$t}"
            done
            # Nokia XG-040G-MD：UBI 与 UBI-USB-SFP 为同一台设备的不同装配
            # （profile 互为 SUPPORTED_DEVICES 别名），归并为一个型号包
            case "$model" in
              nokia_xg-040g-md-ubi-usb-sfp) model="nokia_xg-040g-md-ubi" ;;
            esac
            newbase="${stem}-${BUILD_TIME}.${ext}"
            cp "$f" "tmp_pkg/$newbase"
            # zip 追加模式：同型号的后续文件自动并入同一 zip
            ( cd tmp_pkg && zip -q "../release/${model}-${BUILD_TIME}.zip" "$newbase" )
          done
          rm -rf tmp_pkg
          echo "=== 打包结果（按型号合并） ==="
          ls -la release/

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ matrix.target }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download firmware archives
        uses: actions/download-artifact@v4
        with:
          pattern: ponwrt-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum *.zip > sha256sums

      - name: Extract release notes from CHANGELOG
        run: |
          TAG="${{ inputs.tag }}"
          awk -v tag="$TAG" '
            /^## / {
              if (capturing) exit
              if (index($0, "[" tag "]") > 0) { capturing=1 }
            }
            capturing { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "提取到 [$TAG] 的发布说明："
            cat release-notes.md
          else
            echo "未在 CHANGELOG 找到 [$TAG] 段，将回退到自动生成 notes"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(
            "$RELEASE_TAG"
            release/*.zip
            release/sha256sums
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "PonWrt $RELEASE_TAG"
          )
          if [ -s release-notes.md ]; then
            args+=(--notes-file release-notes.md)
          else
            args+=(--generate-notes)
          fi
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
